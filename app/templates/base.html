<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GlobalBank DB{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}" class="brand">GlobalBank DB</a>
    <div class="nav-links">
      <a href="{{ url_for('local_view', branch='bucharest') }}">Bucuresti (local)</a>
      <a href="{{ url_for('local_view', branch='cluj') }}">Cluj (local)</a>
      <a href="{{ url_for('global_view') }}">Vizualizare Globala</a>
      <a href="{{ url_for('demo_local_to_global') }}">Demo: Local → Global</a>
      <a href="{{ url_for('demo_global_to_local') }}">Demo: Global → Local</a>
      <a href="{{ url_for('demo_replication') }}">Demo: Replicare</a>
    </div>
  </nav>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
